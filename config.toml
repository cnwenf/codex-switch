# codex-switch 默认配置
# 默认不内置第三方 API Key；新增供应商的 Key 由管理页写入 ~/.codex-switch/env，订阅 token 只读 ~/.codex/auth.json。

[proxy]
listen = "127.0.0.1:8787"
mount_prefix = "/v1"
auth_json_path = "~/.codex/auth.json"

# 订阅路由:Codex 用 requires_openai_auth=true 自带 OAuth token(新鲜),proxy 原样转发,
# 仅在缺失时补 ChatGPT-Account-ID。
# models 只是回退清单:auth=chatgpt_subscription 的供应商会自动同步 codex 二进制
# 内嵌官方 catalog 的全部模型(官方新增模型 → 升级 codex 即自动出现)。
# 注意:gpt-5.6(裸 slug)与 codex-1 不存在,官方后端会拒绝。
[[providers]]
id = "chatgpt-sub"
name = "ChatGPT 订阅"
base_url = "https://chatgpt.com/backend-api/codex"
auth = "chatgpt_subscription"
models = ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna", "gpt-5.5", "gpt-5.4", "gpt-5.4-mini", "gpt-5.2", "codex-auto-review", "gpt-5.3-codex-spark"]

# ---------- 模型能力覆盖(可选)----------
# 能力解析优先级:[model_overrides] > provider 联网获取(支持且配了凭据时,缓存 30 分钟)
#              > 内置静态表(见 src/caps.js) > 保守默认(128K / 无视觉 / 不声明推理档位)。
# 配好 provider 的 API key 和 URL 后,proxy 在启动与保存配置时自动联网抓取上下文窗口与输入模态;
# 也可手工覆盖(例如对齐企业限流或新模型):
#
# [model_overrides."qwen3.8-max"]
# context_window = 1000000          # 上下文窗口(tokens)
# vision = true                     # 是否支持图片输入
# reasoning_efforts = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]
# default_reasoning_effort = "medium"
#
# 能力只影响生成的 catalog.json(见管理页 ~/.codex/catalog.json),不改变请求转发的任何字节。
# 保存后热生效;重启 Codex 后新 catalog 生效。
