name: Build release DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to build
        required: true
        type: string

permissions: {}

concurrency:
  group: release-dmg-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: v22.23.2
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      dmg_name: ${{ steps.metadata.outputs.dmg_name }}
      checksum_name: ${{ steps.metadata.outputs.checksum_name }}
    steps:
      - name: Resolve and validate published release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64

          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG="$EVENT_TAG"
          else
            TAG="$INPUT_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+[0-9A-Za-z.+-]*$ ]]; then
            echo "::error::invalid release tag: $TAG"
            exit 1
          fi

          RELEASE_JSON=$(gh api --method GET "repos/$GH_REPO/releases/tags/$TAG")
          if ! jq -e 'has("immutable")' <<<"$RELEASE_JSON" >/dev/null; then
            echo "::error::GitHub REST omitted the immutable field; refusing to publish without a confirmed mutable release"
            exit 1
          fi
          jq -e --arg tag "$TAG" '
            .tag_name == $tag and
            .draft == false and
            .published_at != null and
            .immutable == false
          ' <<<"$RELEASE_JSON" >/dev/null

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag and package metadata
        id: metadata
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          EXPECTED_TAG_COMMIT=$(git rev-list -n 1 "refs/tags/$TAG")
          ACTUAL_HEAD=$(git rev-parse HEAD)
          if [[ -z "$EXPECTED_TAG_COMMIT" || "$ACTUAL_HEAD" != "$EXPECTED_TAG_COMMIT" ]]; then
            echo "::error::checked out HEAD $ACTUAL_HEAD does not match peeled tag commit $EXPECTED_TAG_COMMIT"
            exit 1
          fi

          VERSION=$(node -p 'require("./package.json").version')
          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "::error::release tag $TAG does not match package version v${VERSION}"
            exit 1
          fi
          DMG_NAME="CodexSwitch-${VERSION}-macos-arm64.dmg"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$DMG_NAME.sha256" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test

      - name: Build macOS app and DMG
        run: sh scripts/build-macos-app.sh

      - name: Verify signature, DMG, and checksum
        shell: bash
        env:
          DMG_NAME: ${{ steps.metadata.outputs.dmg_name }}
          CHECKSUM_NAME: ${{ steps.metadata.outputs.checksum_name }}
        run: |
          set -euo pipefail
          DMG="dist/$DMG_NAME"
          test -f "$DMG"
          hdiutil verify "$DMG"

          MOUNT_DIR=$(mktemp -d)
          cleanup() {
            hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true
            rmdir "$MOUNT_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR" >/dev/null
          codesign --verify --verbose=2 "$MOUNT_DIR/Codex Switch.app"
          hdiutil detach "$MOUNT_DIR" >/dev/null
          trap - EXIT
          rmdir "$MOUNT_DIR"

          (
            cd dist
            shasum -a 256 "$DMG_NAME" > "$CHECKSUM_NAME"
            shasum -a 256 -c "$CHECKSUM_NAME"
          )

      - name: Transfer verified release pair
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dmg-${{ steps.release.outputs.tag }}
          path: |
            dist/${{ steps.metadata.outputs.dmg_name }}
            dist/${{ steps.metadata.outputs.checksum_name }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified release pair
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-dmg-${{ needs.build.outputs.tag }}
          path: dist

      - name: Publish or verify exact release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          DMG_NAME: ${{ needs.build.outputs.dmg_name }}
          CHECKSUM_NAME: ${{ needs.build.outputs.checksum_name }}
        run: |
          set -euo pipefail
          (
            cd dist
            shasum -a 256 -c "$CHECKSUM_NAME"
          )

          RELEASE_JSON=$(gh api --method GET "repos/$GH_REPO/releases/tags/$TAG")
          if ! jq -e 'has("immutable")' <<<"$RELEASE_JSON" >/dev/null; then
            echo "::error::GitHub REST omitted the immutable field; refusing to publish without a confirmed mutable release"
            exit 1
          fi
          jq -e --arg tag "$TAG" '
            .tag_name == $tag and
            .draft == false and
            .published_at != null and
            .immutable == false
          ' <<<"$RELEASE_JSON" >/dev/null

          ASSET_NAMES=$(jq -r '.assets[].name' <<<"$RELEASE_JSON")
          dmg_present=false
          checksum_present=false
          if grep -Fxq "$DMG_NAME" <<<"$ASSET_NAMES"; then dmg_present=true; fi
          if grep -Fxq "$CHECKSUM_NAME" <<<"$ASSET_NAMES"; then checksum_present=true; fi

          if [[ "$dmg_present" == false && "$checksum_present" == false ]]; then
            gh release upload "$TAG" "dist/$DMG_NAME" "dist/$CHECKSUM_NAME" --repo "$GH_REPO"
          elif [[ "$dmg_present" == true && "$checksum_present" == true ]]; then
            mkdir existing-assets
            gh release download "$TAG" \
              --repo "$GH_REPO" \
              --pattern "$DMG_NAME" \
              --pattern "$CHECKSUM_NAME" \
              --dir existing-assets
            (
              cd existing-assets
              shasum -a 256 -c "$CHECKSUM_NAME"
            )
            cmp "dist/$DMG_NAME" "existing-assets/$DMG_NAME"
            cmp "dist/$CHECKSUM_NAME" "existing-assets/$CHECKSUM_NAME"
          else
            echo "::error::only one release asset exists; refusing to overwrite or complete a partial pair"
            exit 1
          fi
